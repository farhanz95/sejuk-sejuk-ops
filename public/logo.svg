<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sejuk Sejuk Service logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b93c4"/>
      <stop offset="0.55" stop-color="#1c6489"/>
      <stop offset="1" stop-color="#16455f"/>
    </linearGradient>
    <linearGradient id="flake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9eefb"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- snowflake: six arms, each with a pair of barbs -->
  <g stroke="url(#flake)" stroke-width="26" stroke-linecap="round" fill="none"
     transform="translate(256 244)">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-138"/>
      <line x1="0" y1="-78" x2="-34" y2="-112"/>
      <line x1="0" y1="-78" x2="34" y2="-112"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>

  <!-- cool air flowing out of the vent -->
  <g stroke="#a9dcf3" stroke-width="17" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M150 372c34 22 70 22 104 0"/>
    <path d="M258 372c34 22 70 22 104 0"/>
    <path d="M204 414c34 22 70 22 104 0"/>
  </g>
</svg>
